[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-bench"
version = "0.1.0"
description = "Đo và xếp hạng công cụ OCR cho Sovereign"
requires-python = ">=3.11"
dependencies = []

# Engine thật cài rời, không phải dependency mặc định: marker-pdf kéo theo torch +
# model Surya vài GB, opendataloader cần Java 11+. Ai chạy adapter nào thì cài extra
# đó — `pytest` của repo phải xanh trên máy trắng, không cài gì thêm.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
marker = ["marker-pdf==1.10.2"]
opendataloader = ["opendataloader-pdf==2.5.0"]
pdfinspector = ["pdf-inspector==0.2.6"]
metrics = ["jiwer>=3", "rapidfuzz>=3", "apted>=1.0.3", "Distance>=0.1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "needs_corpus: cần bộ mẫu thật trên đĩa (scripts/fetch_*.py). Tự skip nếu chưa có.",
]

[tool.coverage.run]
source = ["ocr_bench"]
branch = true

[tool.coverage.report]
show_missing = true
# Cổng nghiệm thu 3: không được còn file 0%. File 0% nghĩa là code viết ra chưa từng
# chạy — hoặc thừa, hoặc chưa test.
skip_empty = true
