[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-bench"
version = "0.1.0"
description = "Đo và xếp hạng công cụ OCR cho Sovereign"
requires-python = ">=3.11"
# Pillow là dependency THẬT, không phải extra: hợp đồng dữ liệu nói `OcrImage.data`
# là **bytes PNG**, mà mọi engine đều xuất định dạng khác (Marker mặc định JPEG). Quy
# đổi định dạng là việc của bench chứ không của adapter nào, nên nó không được nằm sau
# một extra — thiếu nó thì `data` mang hai định dạng tuỳ engine và metric so ảnh nhận
# hai kiểu dữ liệu. Pillow ~3 MB, không kéo theo torch.
dependencies = ["Pillow>=10"]

# Engine thật cài rời, không phải dependency mặc định: marker-pdf kéo theo torch +
# model Surya vài GB, opendataloader cần Java 11+. Ai chạy adapter nào thì cài extra
# đó — `pytest` của repo phải xanh trên máy trắng, không cài gì thêm.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
docling = ["docling[easyocr]==2.91.0"]
marker = ["marker-pdf==1.10.2"]
# `pypdf` không phải phụ thuộc của opendataloader-pdf — bộ nối cần nó vì JSON của
# engine KHÔNG có kích thước trang (đã kiểm mọi node của 24 tài liệu), mà không có
# kích thước thì không chuẩn hoá được toạ độ.
opendataloader = ["opendataloader-pdf==2.5.0", "pypdf>=5"]
opendataloader-hybrid = [
  "opendataloader-pdf[hybrid]==2.5.0",
  "docling[easyocr]>=2.91.0",
  "easyocr>=1.7,<2",
  "fastapi>=0.136.1",
  "python-multipart>=0.0.28",
  "uvicorn>=0.46.0",
  "pypdf>=5",
  "packaging>=23",
  "psutil>=5",
]
# `pypdf` cũng bắt buộc ở đây, không chỉ ở extra opendataloader: `pdf_inspector.py:119`
# import nó để lấy kích thước trang. Thiếu nó thì adapter không ném lúc import mà **hỏng
# lúc chạy** — `OcrResult.failed=True` với `ModuleNotFoundError`, tức engine trông như
# engine tồi chứ không như môi trường thiếu gói.
pdfinspector = ["pdf-inspector==0.2.6", "pypdf>=5"]
# `Distance` đã bị bỏ (B2/AC-02): bản gốc TEDS dùng nó, nhưng nó chỉ có sdist (phải
# biên dịch khi cài), không còn được bảo trì, và `rapidfuzz` — vốn đã nằm đây — cho
# **cùng** kết quả trên 6000 cặp ngẫu nhiên. `apted` là thuần Python nên giữ.
metrics = ["jiwer>=3", "rapidfuzz>=3", "apted>=1.0.3"]
# Thiếu `psutil` thì cột RSS hiện `—`, không phải 0 MB — xem `src/ocr_bench/rss.py`.
# Bắt buộc cài trước khi lấy số perf công bố (D1): thiếu nó thì `opendataloader` (chạy
# JVM con) và `sovereign` (nhánh subprocess) bị đo hụt theo một hướng biết trước.
perf = ["psutil>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "needs_corpus: cần bộ mẫu thật trên đĩa (scripts/fetch_*.py). Tự skip nếu chưa có.",
  # Vẫn chạy mặc định — nó là bằng chứng cho AC-02 của TASK-073, tắt đi thì mất.
  # Đánh dấu để lúc gỡ lỗi còn `-m 'not slow'` được.
  "slow: chạy lâu (vài giây), thường là test đo giờ ở quy mô thật.",
  # Marker là extra, KHÔNG phải dependency (torch + Surya vài GB). Tự skip nếu
  # chưa cài — máy trắng vẫn phải `pytest` xanh.
  "needs_marker: cần marker-pdf đã cài (extra `marker`). Tự skip nếu chưa có.",
  "needs_docling: cần docling[easyocr]==2.91.0 đã cài. Tự skip có lý do nếu chưa có.",
]

[tool.coverage.run]
source = ["ocr_bench"]
branch = true

[tool.coverage.report]
show_missing = true
# Cổng nghiệm thu 3: không được còn file 0%. File 0% nghĩa là code viết ra chưa từng
# chạy — hoặc thừa, hoặc chưa test.
skip_empty = true
